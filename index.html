<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Invitaci&#243;n M&#214;BIUS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600&display=swap">
<style>
/* Layout: una sola escena oscura; sobre crema centrado que se abre y libera la tarjeta de invitaci&#243;n */
:root{
  --night:#0B0B0B; --night2:#151413; --cream:#F5F4F0; --paper:#EEEAE1; --paper-shade:#E2DDD1;
  --gold:#C6A36A; --gold-deep:#A8874F; --ink:#0B0B0B; --muted:#6B6B6B; --line:#DAD6CC;
  --f:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:radial-gradient(120% 90% at 50% 20%,#1c1a17 0%,var(--night) 60%);color:var(--cream);font-family:var(--f);-webkit-font-smoothing:antialiased;overflow-x:hidden}
.stage{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding-inline:16px;padding-block:48px 40px;gap:28px}
.kicker{font-size:11px;letter-spacing:.32em;text-transform:uppercase;color:var(--gold);text-align:center}
.hint{font-size:13px;color:#A9A49A;letter-spacing:.04em;text-align:center;transition:opacity .4s}

/* ENVELOPE */
.env{position:relative;width:min(92vw,440px);aspect-ratio:1.42;perspective:1400px;margin-top:40px;transition:opacity .6s, transform .6s}
.env.gone{opacity:0;transform:translateY(40px) scale(.94);pointer-events:none}
.env.hidden{display:none}
.back{position:absolute;inset:0;background:var(--paper-shade);border-radius:6px;box-shadow:0 30px 60px rgba(0,0,0,.55)}
.peek{position:absolute;left:6%;right:6%;bottom:6%;height:88%;background:var(--cream);border-radius:4px;z-index:2;display:grid;place-items:start center;padding-top:9%;
  transform:translateY(0);transition:transform 1s cubic-bezier(.2,.7,.2,1) .5s;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.peek img{width:46%;height:auto}
.env.open .peek{transform:translateY(-62%)}
.card{width:min(92vw,440px);background:var(--cream);color:var(--ink);border-radius:6px;overflow:hidden;box-shadow:0 30px 60px rgba(0,0,0,.55);
  opacity:0;transform:translateY(40px);transition:opacity .8s, transform .9s cubic-bezier(.2,.7,.2,1)}
.card[hidden]{display:none!important}
.card.show{opacity:1;transform:none}
.front{position:absolute;inset:0;z-index:3;pointer-events:none}
.front svg{width:100%;height:100%;display:block}
.flap{position:absolute;left:0;right:0;top:0;height:58%;transform-origin:top center;transition:transform .8s cubic-bezier(.4,.1,.2,1),z-index 0s .4s;z-index:4}
.flap svg{width:100%;height:100%;display:block;filter:drop-shadow(0 4px 6px rgba(0,0,0,.12))}
.env.open .flap{transform:rotateX(180deg);z-index:1}
.seal{position:absolute;left:50%;top:58%;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;z-index:5;border:0;cursor:pointer;
  background:radial-gradient(circle at 35% 30%,#d9bb86,var(--gold) 45%,var(--gold-deep));box-shadow:0 6px 14px rgba(0,0,0,.35), inset 0 0 0 3px rgba(255,255,255,.12);
  display:grid;place-items:center;transition:opacity .35s, transform .35s}
.seal img{width:34px;height:auto}
.seal:hover{transform:scale(1.05)}
.seal:focus-visible{outline:2px solid var(--cream);outline-offset:4px}
.env.open .seal{opacity:0;transform:scale(.6);pointer-events:none}
.addr{position:absolute;left:0;right:0;bottom:12%;z-index:4;text-align:center;color:var(--muted);font-size:12px;letter-spacing:.24em;text-transform:uppercase;transition:opacity .3s}
.env.open .addr{opacity:0}

/* CARD CONTENT */
.inner{display:flex;flex-direction:column}
.photo{aspect-ratio:16/10;background-size:cover;background-position:50% 50%;position:relative}
.photo::after{content:"";position:absolute;inset:auto 0 0 0;height:38%;background:linear-gradient(180deg,rgba(245,244,240,0),var(--cream))}
.content{display:flex;flex-direction:column;align-items:center;text-align:center;padding:8px 32px 30px}
.lead{font-size:11px;letter-spacing:.32em;text-transform:uppercase;color:var(--muted)}
.logo{width:46%;max-width:190px;height:auto;margin-top:16px}
.tag{font-size:15.5px;font-weight:300;line-height:1.5;margin:22px 0 0;max-width:26ch;text-wrap:balance}
.tag b{font-weight:500}
.rule{width:40px;height:1px;background:var(--gold);border:0;margin:26px 0}
.datebox{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;width:100%;max-width:300px;column-gap:18px}
.datebox .side{font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:var(--muted);padding-block:10px;border-block:1px solid var(--line)}
.datebox .num{font-size:52px;font-weight:300;line-height:1;font-variant-numeric:tabular-nums}
.datebox small{display:block;font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:var(--ink);margin-top:6px}
.time{font-size:14px;font-weight:500;letter-spacing:.04em;margin-top:18px}
.where{font-size:15px;font-weight:500;margin-top:20px;line-height:1.45}
.where span{display:block;font-weight:400;color:var(--muted);font-size:13px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:320px;margin-top:28px}
.btn{font:inherit;font-size:13px;font-weight:500;text-decoration:none;padding:12px 10px;border-radius:999px;border:1px solid var(--ink);color:var(--ink);background:transparent;text-align:center}
.btn.primary{background:var(--ink);color:var(--cream)}
.btn:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.small{font-size:11.5px;color:var(--muted);margin-top:12px;font-variant-numeric:tabular-nums}
.muni{font-size:11px;color:var(--muted);letter-spacing:.06em;margin-top:24px;padding-top:16px;border-top:1px solid var(--line);width:100%;max-width:320px}
.dot{color:var(--gold)}
.foot{font-size:12px;color:#8A867E;letter-spacing:.06em;text-align:center;opacity:0;transition:opacity .6s 1.4s}
.card.show ~ .foot{opacity:1}

@media (prefers-reduced-motion: reduce){*{transition-duration:.01ms!important;transition-delay:0s!important}}
</style>
</head>
<body>

<main class="stage">
  <div class="kicker">Invitaci&#243;n</div>

  <div class="env" id="env">
    <div class="back"></div>

    <div class="peek"><img id="peekimg" alt=""></div>

    <div class="front" aria-hidden="true">
      <svg viewBox="0 0 440 310" preserveAspectRatio="none">
        <path d="M0 0 L220 175 L440 0 L440 310 L0 310 Z" fill="#F5F4F0"/>
        <path d="M0 310 L220 160 L440 310" fill="none" stroke="#DAD6CC" stroke-width="1"/>
      </svg>
    </div>
    <div class="flap" aria-hidden="true">
      <svg viewBox="0 0 440 180" preserveAspectRatio="none">
        <path d="M0 0 L440 0 L220 180 Z" fill="#EEEAE1"/>
        <path d="M0 0 L220 180 L440 0" fill="none" stroke="#DAD6CC" stroke-width="1"/>
      </svg>
    </div>
    <button class="seal" id="seal" type="button" aria-label="Abrir la invitaci&#243;n"><img id="sealimg" alt=""></button>
    <div class="addr">Para vos</div>
  </div>

    <article class="card" id="card" hidden>
      <div class="inner">
        <div class="photo" id="photo" role="img" aria-label="M&#214;BIUS iluminado de noche en el campo"></div>
        <div class="content">
          <div class="lead">Te invitamos a conocer</div>
          <img class="logo" id="logo" alt="M&#214;BIUS">
          <p class="tag">El sal&#243;n que viaja hasta vos<span class="dot">.</span><br><b>Esta vez, ven&#237; vos a conocerlo.</b></p>
          <hr class="rule">
          <div class="datebox" aria-label="Viernes 6 de noviembre">
            <div class="side">Viernes</div>
            <div class="num">06<small>Nov</small></div>
            <div class="side">2026</div>
          </div>
          <div class="time">19 a 22 h</div>
          <div class="where">Do&#241;a Pipa<span>Jes&#250;s Mar&#237;a, C&#243;rdoba</span></div>
          <div class="actions">
            <a class="btn primary" href="https://wa.me/5493525521000?text=Hola%20M%C3%96BIUS%2C%20confirmo%20mi%20asistencia%20a%20la%20presentaci%C3%B3n%20del%20viernes%206%2F11." target="_blank" rel="noopener">Confirmar</a>
            <a class="btn" href="https://calendar.google.com/calendar/render?action=TEMPLATE&amp;text=Presentaci%C3%B3n%20de%20M%C3%96BIUS&amp;dates=20261106T220000Z%2F20261107T010000Z&amp;location=Do%C3%B1a%20Pipa%2C%20Jes%C3%BAs%20Mar%C3%ADa%2C%20C%C3%B3rdoba&amp;details=Presentaci%C3%B3n%20de%20M%C3%96BIUS%2C%20el%20sal%C3%B3n%20de%20eventos%20m%C3%B3vil." target="_blank" rel="noopener">Agendar</a>
          </div>
          <div class="muni">Con el acompa&#241;amiento de la Municipalidad de Jes&#250;s Mar&#237;a</div>
        </div>
      </div>
    </article>

  <div class="hint" id="hint">Toc&#225; el sello para abrir</div>
  <div class="foot">@mobius.salonmovil</div>
</main>

document.getElementById('photo').style.backgroundImage='url('+A.photo+')';
document.getElementById('logo').src=A.logo;
document.getElementById('sealimg').src=A.seal;
document.getElementById('peekimg').src=A.logo;
const env=document.getElementById('env');
const card=document.getElementById('card'),hint=document.getElementById('hint');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function openEnv(){ if(env.classList.contains('open')) return; env.classList.add('open'); hint.style.opacity=0;
  setTimeout(()=>{ env.classList.add('gone');
    setTimeout(()=>{ env.classList.add('hidden'); card.hidden=false; requestAnimationFrame(()=>requestAnimationFrame(()=>card.classList.add('show'))); window.scrollTo({top:0,behavior:reduce?'auto':'smooth'}); },reduce?0:550);
  }, reduce?0:1700); }
document.getElementById('seal').addEventListener('click',openEnv);
env.addEventListener('click',e=>{ if(!env.classList.contains('open')) openEnv(); });
</script>
